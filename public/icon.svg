<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0d1f10"/>
      <stop offset="100%" stop-color="#060a0e"/>
    </radialGradient>
    <radialGradient id="glowG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glowG)"/>

  <!-- Outer macro ring - Protein (green) -->
  <!-- Arc from 210° to 30° clockwise (large arc) -->
  <circle cx="256" cy="248" r="148" fill="none" stroke="#1a2e1e" stroke-width="18"/>
  <path d="M 256 100
    A 148 148 0 1 1 182 378"
    fill="none" stroke="#4ade80" stroke-width="18" stroke-linecap="round"
    filter="url(#softglow)" opacity="0.9"/>

  <!-- Middle ring - Carbs (cyan) -->
  <circle cx="256" cy="248" r="116" fill="none" stroke="#0e2020" stroke-width="16"/>
  <path d="M 256 132
    A 116 116 0 0 1 356 330"
    fill="none" stroke="#22d3ee" stroke-width="16" stroke-linecap="round"
    filter="url(#softglow)" opacity="0.85"/>

  <!-- Inner ring - Fat (orange) -->
  <circle cx="256" cy="248" r="84" fill="none" stroke="#1e1a0a" stroke-width="14"/>
  <path d="M 256 164
    A 84 84 0 0 1 318 320"
    fill="none" stroke="#fb923c" stroke-width="14" stroke-linecap="round"
    filter="url(#softglow)" opacity="0.8"/>

  <!-- Center bowl shape -->
  <ellipse cx="256" cy="270" rx="42" ry="14" fill="#4ade80" opacity="0.12"/>
  <!-- Bowl body -->
  <path d="M 218 238 Q 218 286 256 294 Q 294 286 294 238 Z"
    fill="#0d2012" stroke="#4ade80" stroke-width="2.5" stroke-opacity="0.6"/>
  <!-- Bowl rim -->
  <ellipse cx="256" cy="238" rx="38" ry="10" fill="none" stroke="#4ade80" stroke-width="2.5" opacity="0.7"/>

  <!-- Leaf/stem sprouting from bowl -->
  <path d="M 256 238 L 256 212"
    stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 256 222 Q 268 214 272 204 Q 260 206 256 216"
    fill="#4ade80" opacity="0.75"/>
  <path d="M 256 218 Q 244 210 240 200 Q 252 202 256 212"
    fill="#4ade80" opacity="0.55"/>

  <!-- Ring labels (P C F dots) -->
  <circle cx="256" cy="100" r="5" fill="#4ade80" filter="url(#softglow)"/>
  <circle cx="356" cy="330" r="4" fill="#22d3ee" filter="url(#softglow)"/>
  <circle cx="318" cy="320" r="3.5" fill="#fb923c" filter="url(#softglow)"/>

  <!-- Subtle bottom text -->
  <text x="256" y="420" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="26" font-weight="700" letter-spacing="4" fill="#4ade80" opacity="0.35">NL</text>
</svg>
