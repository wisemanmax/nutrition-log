<script>
var loadStatus={};
function loadScript(url,name){
  return new Promise(function(resolve,reject){
    var s=document.createElement('script');s.src=url;s.crossOrigin='anonymous';
    s.onload=function(){
      if(typeof window[name]==='undefined'){loadStatus[name]='FAILED';reject(new Error(name+' loaded but not defined from '+url));return;}
      loadStatus[name]='ok';resolve();
    };
    s.onerror=function(){loadStatus[name]='FAILED';reject(new Error(name+' failed from '+url));};
    document.head.appendChild(s);
  });
}
function showError(msg){
  document.getElementById('root').innerHTML='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:24px;text-align:center;gap:12px;background:#060a0e"><div style="font-size:28px">🚫</div><div style="color:#f87171;font-family:monospace;font-size:13px;line-height:1.6;max-width:320px">'+msg+'</div><div style="color:#64748b;font-size:11px">Check your internet connection and reload</div></div>';
}
(function(){
  loadScript('https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js','React')
  .catch(function(){return loadScript('https://unpkg.com/react@18/umd/react.production.min.js','React');})
  .then(function(){
    return loadScript('https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js','ReactDOM')
    .catch(function(){return loadScript('https://unpkg.com/react-dom@18/umd/react-dom.production.min.js','ReactDOM');});
  })
  .then(function(){
    return loadScript('https://cdn.jsdelivr.net/npm/react-is@18.3.1/umd/react-is.production.min.js','ReactIs')
    .catch(function(){return loadScript('https://unpkg.com/react-is@18/umd/react-is.production.min.js','ReactIs');});
  })
  .then(function(){
    return loadScript('https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js','PropTypes')
    .catch(function(){return loadScript('https://unpkg.com/prop-types@15.8.1/prop-types.min.js','PropTypes');});
  })
  .then(function(){
    return loadScript('https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.min.js','Recharts')
    .catch(function(){return loadScript('https://unpkg.com/recharts@2.5.0/umd/Recharts.min.js','Recharts');});
  })
  .then(function(){
    return loadScript('https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.0/babel.min.js','Babel')
    .catch(function(){return loadScript('https://unpkg.com/@babel/standalone@7.24.0/babel.min.js','Babel');});
  })
  .then(function(){
    if(typeof React==='undefined')throw new Error('React not available');
    if(typeof Babel==='undefined')throw new Error('Babel not available');
    var src=document.getElementById('app-source');
    if(!src)throw new Error('App source not found');
    var compiled;
    try{compiled=Babel.transform(src.textContent,{presets:[['react',{runtime:'classic'}]],filename:'app.jsx'}).code;}
    catch(e){throw new Error('Compile error: '+e.message.slice(0,120));}
    try{new Function(compiled)();}
    catch(e){throw new Error('Runtime error: '+e.message.slice(0,120));}
  })
  .catch(function(e){showError(e.message);});
})();
</script>

<script type="text/plain" id="app-source">
const{useState,useEffect,useReducer,useCallback,useMemo,useRef,memo}=React;
const{BarChart,Bar,LineChart,Line,XAxis,YAxis,CartesianGrid,Tooltip,ResponsiveContainer,ReferenceLine}=Recharts;

// ─── Persistence ───
const LS={
  get:(k)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){console.warn("Error:",e);}},
};

// ─── Cookie (SSO across .ironlog.space) ───
const Cookie={
  get:(name)=>{const m=document.cookie.match(new RegExp("(^| )"+name+"=([^;]+)"));return m?decodeURIComponent(m[2]):null;},
  set:(name,value,days=30)=>{const exp=new Date(Date.now()+days*864e5).toUTCString();document.cookie=`${name}=${encodeURIComponent(value)};expires=${exp};path=/;domain=.ironlog.space;SameSite=Lax`;},
  clear:(name)=>{document.cookie=`${name}=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/;domain=.ironlog.space`;},
};

const SYNC_URL=LS.get("ft-api-url")||"https://api.ironlog.space";

const AuthToken={
  // Legacy — kept for backward compat during migration
  init:(email)=>{},
  generate:(email)=>"",
  getHeaders:(email)=>{
    const sessionToken=LS.get("ft-session-token");
    return{
      "Content-Type":"application/json",
      ...(sessionToken?{"X-Session-Token":sessionToken}:{}),
      "X-Auth-Token":email||"legacy",
    };
  },
};

const SessionManager={
  // Create session after signup (called with email + PIN)
  create:async(email,pin,deviceId)=>{
    try{
      const res=await fetch(`${SYNC_URL}/api/auth/session`,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({action:"create",email:email.toLowerCase(),pin,deviceId:deviceId||LS.get("ft-device-id")})
      });
      const json=await res.json();
      if(json.success&&json.token){
        LS.set("ft-session-token",json.token);
        LS.set("ft-session-email",email.toLowerCase());
        LS.set("ft-session-expires",json.expires_at);
        Cookie.set("ironlog_session",json.token,30); // SSO across subdomains
        return{success:true,token:json.token};
      }
      return{success:false,error:json.error,attempts_remaining:json.attempts_remaining};
    }catch(e){return{success:false,error:"Connection failed"};}
  },
  // Check if we have a valid session
  hasSession:()=>{
    const token=LS.get("ft-session-token");
    const expires=LS.get("ft-session-expires");
    if(!token)return false;
    if(expires&&new Date(expires)<new Date()){LS.set("ft-session-token",null);return false;}
    return true;
  },
  // Revoke (logout)
  revoke:async()=>{
    const token=LS.get("ft-session-token");
    if(token){try{await fetch(`${SYNC_URL}/api/auth/session`,{method:"POST",headers:{"Content-Type":"application/json","X-Session-Token":token},body:JSON.stringify({action:"revoke",token})});}catch(e){}}
    SentryUtil.breadcrumb("User signed out","auth");SentryUtil.reset();
    LS.set("ft-session-token",null);LS.set("ft-session-email",null);LS.set("ft-session-expires",null);LS.set("ft-is-admin",null);
    Cookie.clear("ironlog_session"); // Clear SSO cookie
  },
  // Check admin status (silent — never exposes admin to non-admins)
  checkAdmin:async()=>{
    const token=LS.get("ft-session-token");
    const email=LS.get("ft-session-email")||LS.get("ft-profile")?.email;
    if(!token&&!email)return false;
    try{
      const headers={"Content-Type":"application/json"};
      if(token)headers["X-Session-Token"]=token;
      if(email)headers["X-Auth-Token"]=email;
      const res=await fetch(`${SYNC_URL}/api/admin`,{method:"POST",headers,
        body:JSON.stringify({action:"check"})});
      if(res.ok){const json=await res.json();if(json.isAdmin){LS.set("ft-is-admin",true);return true;}}
      LS.set("ft-is-admin",null);return false;
    }catch(e){return false;}
  },
  // ─── Forgot PIN (satellite apps — canonical /api/auth/session) ───
  sendResetCode:async(email)=>{
    try{
      const res=await fetch(`${SYNC_URL}/api/auth/session`,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({action:"send_reset_code",email:email.toLowerCase()})});
      return res.ok?{success:true}:{success:false,error:"Email not found"};
    }catch(e){return{success:false,error:"Connection failed"};}
  },
  verifyResetCode:async(email,code)=>{
    try{
      const res=await fetch(`${SYNC_URL}/api/auth/session`,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({action:"verify_reset_code",email:email.toLowerCase(),code})});
      return res.ok?{success:true}:{success:false,error:"Invalid code"};
    }catch(e){return{success:false,error:"Connection failed"};}
  },
  setNewPin:async(email,code,newPin)=>{
    try{
      const res=await fetch(`${SYNC_URL}/api/auth/session`,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({action:"set_new_pin",email:email.toLowerCase(),resetToken:code,newPin})});
      return res.ok?{success:true}:{success:false,error:"Reset failed"};
    }catch(e){return{success:false,error:"Connection failed"};}
  },
};

// ─── Cloud Sync (nutritionlog) ───
let _syncTimer=null;let _syncInFlight=false;
const CloudSync={
  push:async(state)=>{
    if(_syncInFlight)return;
    const email=state.profile?.email||LS.get("ft-session-email");
    if(!email)return;
    _syncInFlight=true;
    const payload=JSON.stringify({
      email,
      deviceId:LS.get("ft-device-id")||"unknown",
      appVersion:"nutritionlog-1.0",
      workouts:[],
      nutrition:state.nutrition||[],
      body:state.body||[],
      photos:[],checkins:[],milestones:[],
      settings:{goals:state.goals,units:state.units,
        schedule:null,exercises:null,phases:[],injuries:[],
        privacy:{},supplements:[],accountability:[],gamification:null},
    });
    try{
      const res=await fetch(`${SYNC_URL}/api/sync/push`,{method:"POST",headers:AuthToken.getHeaders(email),body:payload});
      if(res.status===401){LS.set("ft-session-token",null);_syncInFlight=false;return;}
      if(!res.ok)throw new Error("Push failed");
    }catch(e){console.warn("Sync push error:",e);}
    _syncInFlight=false;
  },
  debouncedPush:(state)=>{
    if(_syncTimer)clearTimeout(_syncTimer);
    _syncTimer=setTimeout(()=>CloudSync.push(state),3000);
  },
  pull:async(email,deviceId,pin)=>{
    try{
      const res=await fetch(`${SYNC_URL}/api/sync/pull`,{
        method:"POST",
        headers:AuthToken.getHeaders(email),
        body:JSON.stringify({email,deviceId,pin:pin||null}),
      });
      const json=await res.json();
      if(res.status===403&&json.pin_required)return{pin_required:true};
      if(res.status===403)return{wrong_pin:true,attempts_remaining:json.attempts_remaining,locked:json.locked};
      if(res.status===429)return{locked:true,retry_minutes:json.retry_minutes};
      if(json.success===false)return{error:json.error||"Account not found"};
      if(!res.ok)return{error:"Server error"};
      if(json.success)return json;
      return null;
    }catch(e){return{error:"Connection failed"};}
  },
};

// ─── NutritionLog XP Calculation ───
function calcScore(s){
  let xp=0;
  const entries=s.nutrition||[];
  // Each meal item logged: 5 XP (meals is [{name, items}, ...])
  let mealCount=0;entries.forEach(e=>{const meals=Array.isArray(e.meals)?e.meals:[];meals.forEach(m=>{mealCount+=(m.items||[]).length;});});
  xp+=mealCount*5;
  // Each logged day: +10 XP
  const days=new Set(entries.map(e=>e.date));xp+=days.size*10;
  // Hit protein goal days: +15 XP each
  const goals=s.goals||{};const proteinGoal=goals.protein||0;
  entries.forEach(e=>{const tot=e.protein||0;if(proteinGoal>0&&tot>=proteinGoal*0.9)xp+=15;});
  // Hit calorie goal days: +20 XP each
  const calGoal=goals.cal||0;
  entries.forEach(e=>{const tot=e.cal||0;if(calGoal>0&&tot>=calGoal*0.85&&tot<=calGoal*1.15)xp+=20;});
  // Body weight logs: +10 XP each
  xp+=(s.body||[]).filter(b=>b.weight).length*10;
  // Streak milestones
  const nutDays=([...days]).sort();let streak2=0;let d2=new Date();
  for(let i=0;i<90;i++){const ds=new Date(d2);ds.setDate(d2.getDate()-i);const key=ds.toISOString().split("T")[0];if(days.has(key))streak2++;else break;}
  if(streak2>=7)xp+=100;if(streak2>=14)xp+=200;if(streak2>=30)xp+=500;
  const rank=[...IRON_RANKS].reverse().find(r=>xp>=r.xpNeeded)||IRON_RANKS[0];
  const nextRank=IRON_RANKS.find(r=>r.level===rank.level+1);
  const xpIntoRank=xp-rank.xpNeeded;
  const xpForNext=nextRank?(nextRank.xpNeeded-rank.xpNeeded):null;
  const pct=xpForNext?Math.min(100,Math.round(xpIntoRank/xpForNext*100)):100;
  return{xp,rank,nextRank,xpIntoRank,xpForNext,pct,streak:streak2};
}

// ─── NutritionLog Daily Missions ───
function getDailyMissions(s){
  const td=today();
  const todayEntry=(s.nutrition||[]).find(e=>e.date===td)||{meals:[],totals:{}};
  const meals=Array.isArray(todayEntry.meals)?todayEntry.meals:[];
  const mealCount=meals.reduce((a,m)=>a+(m.items||[]).length,0);
  const goals=s.goals||{};
  const waterKey="nl-water-"+td;
  const water=(() => {try{return parseInt(localStorage.getItem(waterKey)||"0");}catch(e){return 0;}})();
  const bodyToday=(s.body||[]).some(b=>b.date===td&&b.weight);
  const breakfastMeal=meals.find(m=>m.name==="Breakfast");
  return[
    {icon:"🍳",title:"Log Breakfast",desc:"Add at least one breakfast item",xp:20,done:(breakfastMeal?.items||[]).length>0},
    {icon:"🥗",title:"Log 3 Meals",desc:"Log breakfast, lunch, and dinner",xp:30,done:mealCount>=3},
    {icon:"💪",title:"Hit Protein Goal",desc:"Reach 90%+ of your protein target",xp:35,done:goals.protein>0&&(todayEntry.protein||0)>=(goals.protein*0.9)},
    {icon:"🎯",title:"Hit Calorie Goal",desc:"Stay within 15% of calorie target",xp:25,done:goals.cal>0&&(todayEntry.cal||0)>=(goals.cal*0.85)&&(todayEntry.cal||0)<=(goals.cal*1.15)},
    {icon:"💧",title:"8 Cups of Water",desc:"Log your full daily water intake",xp:20,done:water>=8},
    {icon:"⚖️",title:"Weigh In",desc:"Log today's body weight",xp:15,done:bodyToday},
  ];
}

// ─── Level-Up Detection Hook ───
function useLevelUp(score,lsKey){
  const {rank}=score;
  const [celebrating,setCelebrating]=useState(false);
  const [celebRank,setCelebRank]=useState(null);
  useEffect(()=>{
    const saved=parseInt(LS.get(lsKey)||"1");
    if(rank.level>saved){
      LS.set(lsKey,rank.level);
      setCelebRank(rank);
      setTimeout(()=>setCelebrating(true),400);
    } else if(!LS.get(lsKey)){LS.set(lsKey,rank.level);}
  },[rank.level]);
  return{celebrating,celebRank,dismiss:()=>setCelebrating(false)};
}

// ─── Level-Up Celebration ───
function LevelUpCelebration({rank,onDismiss}){
  const [show,setShow]=useState(false);
  useEffect(()=>{setTimeout(()=>setShow(true),50);},[]);
  const dismiss=()=>{setShow(false);setTimeout(onDismiss,300);};
  // Burst particles
  const particles=Array.from({length:16},(_,i)=>({angle:i/16*360,color:[rank.color,"#fbbf24","#34d399","#60a5fa","#c084fc"][i%5]}));
  return ReactDOM.createPortal(
    <div onClick={dismiss} style={{position:"fixed",inset:0,zIndex:9998,background:"rgba(0,0,0,0.85)",display:"flex",alignItems:"center",justifyContent:"center",opacity:show?1:0,transition:"opacity .3s",backdropFilter:"blur(4px)"}}>
      {/* Particles */}
      <div style={{position:"absolute",top:"50%",left:"50%",pointerEvents:"none"}}>
        {show&&particles.map((p,i)=>{const rad=p.angle*Math.PI/180;const dist=80+Math.random()*60;return(
          <div key={i} style={{position:"absolute",width:8,height:8,borderRadius:4,background:p.color,
            transform:`translate(${Math.cos(rad)*dist}px, ${Math.sin(rad)*dist}px)`,
            animation:"fadeUp .6s ease both",animationDelay:i*0.03+"s"}}/>
        );})}
      </div>
      <div onClick={e=>e.stopPropagation()} style={{textAlign:"center",padding:"32px 28px",borderRadius:24,background:`linear-gradient(135deg,${rank.color}18,${rank.tierColor}08)`,border:`2px solid ${rank.color}50`,maxWidth:300,margin:"0 20px",position:"relative",zIndex:1}}>
        <div style={{fontSize:56,marginBottom:8,lineHeight:1}}>{rank.icon}</div>
        <div style={{fontSize:11,fontWeight:700,color:rank.color,textTransform:"uppercase",letterSpacing:2,marginBottom:4}}>Rank Up!</div>
        <div style={{fontSize:26,fontWeight:900,color:rank.color,marginBottom:4}}>{rank.name}</div>
        <div style={{fontSize:13,color:V.text3,marginBottom:4}}>{rank.tier} · Level {rank.level}</div>
        <div style={{fontSize:11,color:V.text3,marginBottom:20}}>Tap anywhere to dismiss</div>
        <div style={{padding:"10px 16px",borderRadius:10,background:`${rank.color}15`,border:`1px solid ${rank.color}30`}}>
          <div style={{fontSize:10,color:V.text3,marginBottom:2}}>NEXT: {rank.level<30?"rank up at "+IRON_RANKS.find(r=>r.level===rank.level+1)?.xpNeeded.toLocaleString()+" XP":"MAX RANK"}</div>
        </div>
      </div>
    </div>,
    document.body
  );
}

const UndoMgr={_fn:null,_timer:null,show:(msg,onUndo,accent)=>{if(UndoMgr._timer)clearTimeout(UndoMgr._timer);if(UndoMgr._fn)UndoMgr._fn({msg,onUndo,accent:accent||V.accent,ts:Date.now()});UndoMgr._timer=setTimeout(()=>{if(UndoMgr._fn)UndoMgr._fn(null);},5000);},clear:()=>{if(UndoMgr._timer)clearTimeout(UndoMgr._timer);if(UndoMgr._fn)UndoMgr._fn(null);}};
function UndoToastBar(){
  const [item,setItem]=useState(null);

// ─── Barcode Scanner ───
function BarcodeScanner({onResult,onClose}){
  const [loading,setLoading]=useState(true);
  const [error,setError]=useState("");
  const [barcode,setBarcode]=useState("");
  const videoRef=useRef(null);
  const streamRef=useRef(null);
  const stopCamera=()=>{streamRef.current?.getTracks().forEach(t=>t.stop());};
  useEffect(()=>{
    (async()=>{
      try{
        const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:1280},height:{ideal:720}}});
        streamRef.current=s;
        if(videoRef.current){videoRef.current.srcObject=s;await videoRef.current.play();}
        setLoading(false);
      }catch(e){setError("Camera access denied. Please allow camera and try again.");setLoading(false);}
    })();
    return()=>stopCamera();
  },[]);
  const lookup=async()=>{
    if(!barcode.trim())return;
    setLoading(true);
    try{
      const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${barcode.trim()}.json`);
      const j=await r.json();
      if(j.status===1&&j.product?.nutriments){
        const p=j.product;const n=p.nutriments;const serv=p.serving_size||"100g";
        const cal=Math.round(n["energy-kcal_serving"]||n["energy-kcal_100g"]||0);
        const protein=Math.round(n.proteins_serving||n.proteins_100g||0);
        const carbs=Math.round(n.carbohydrates_serving||n.carbohydrates_100g||0);
        const fat=Math.round(n.fat_serving||n.fat_100g||0);
        const safeName=String(p.product_name||"Food").replace(/[<>&"']/g,"").slice(0,100);
        const safeServ=String(serv).replace(/[<>&"']/g,"").slice(0,30);
        onResult({name:`${safeName} (${safeServ})`,cal,protein,carbs,fat});
        stopCamera();onClose();
      }else{setError("Product not found. Try manual entry.");setLoading(false);}
    }catch(e){setError("Lookup failed. Check connection.");setLoading(false);}
  };
  return ReactDOM.createPortal(
    <div style={{position:"fixed",inset:0,zIndex:9995,background:"#000",display:"flex",flexDirection:"column"}}>
      <div style={{display:"flex",alignItems:"center",gap:12,padding:"max(16px,env(safe-area-inset-top,0px)) 16px 12px",background:"rgba(0,0,0,0.8)"}}>
        <button onClick={()=>{stopCamera();onClose();}} style={{background:"none",border:"none",cursor:"pointer",color:V.accent,fontSize:14,fontWeight:600,fontFamily:V.font,display:"flex",alignItems:"center",gap:4}}>
          {I.chevLeft({s:20,c:V.accent})} Back
        </button>
        <span style={{color:"white",fontWeight:600,fontSize:16,flex:1,textAlign:"center",marginRight:40}}>Scan Barcode</span>
      </div>
      {loading&&<div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",color:"rgba(255,255,255,0.5)",fontSize:13}}>Initializing camera...</div>}
      <video ref={videoRef} muted playsInline style={{flex:1,objectFit:"cover",display:loading?"none":"block"}}/>
      <div style={{padding:"16px",paddingBottom:"max(24px,env(safe-area-inset-bottom,0px))",background:"rgba(0,0,0,0.85)"}}>
        {error&&<div style={{color:V.danger,fontSize:12,marginBottom:10,textAlign:"center"}}>{error}</div>}
        <div style={{display:"flex",gap:8}}>
          <input value={barcode} onChange={e=>setBarcode(e.target.value)} placeholder="Enter barcode manually..."
            inputMode="numeric" onKeyDown={e=>e.key==="Enter"&&lookup()}
            style={{flex:1,padding:"12px",background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:12,color:"white",fontSize:16,fontFamily:V.mono,outline:"none"}}/>
          <button onClick={lookup} style={{padding:"12px 20px",background:V.accent,border:"none",borderRadius:12,cursor:"pointer",fontSize:14,fontWeight:700,color:"#060a0e",fontFamily:V.font}}>Lookup</button>
        </div>
      </div>
    </div>,
    document.body
  );
}

// ─── Height parsing helper ───
function parseHeightToM(h){
  if(!h)return null;const hs=String(h).trim();
  const cm=hs.match(/^([\d.]+)\s*cm$/i);if(cm)return parseFloat(cm[1])/100;
  const fi=hs.match(/^(\d+)['\s](\d+)/);if(fi)return(parseInt(fi[1])*12+parseInt(fi[2]))*0.0254;
  const ff=hs.match(/^(\d+)'?$/);if(ff)return parseInt(ff[1])*0.3048;
  return null;
}

// ─── Nutrition streak hook ───
function useNutritionStreak(nutrition){
  return useMemo(()=>{
    let c=0,i=0;
    while(nutrition.some(n=>n.date===ago(i))){c++;i++;}
    return c;
  },[nutrition]);
}

// ─── State ───
const init={
  tab:"home",nutrition:[],body:[],
  goals:{cal:2200,protein:180,carbs:220,fat:65,goalWeight:175,tdee:0,fiber:25},
  units:"lbs",loaded:false,onboarded:false,
  profile:{firstName:"",lastName:"",email:"",height:"",sex:""},
};

function reducer(s,a){
  switch(a.type){
    case "INIT": return{...s,...a.p,loaded:true};
    case "TAB": return{...s,tab:a.tab};
    case "ADD_N": return{...s,nutrition:[a.n,...s.nutrition].sort((a,b)=>b.date.localeCompare(a.date))};
    case "EDIT_N": return{...s,nutrition:s.nutrition.map(n=>n.id===a.n.id?a.n:n)};
    case "DEL_N": return{...s,nutrition:s.nutrition.filter(n=>n.id!==a.id)};
    case "ADD_B": return{...s,body:[a.b,...s.body].sort((a,b)=>b.date.localeCompare(a.date))};
    case "EDIT_B": return{...s,body:s.body.map(b=>b.id===a.b.id?a.b:b)};
    case "DEL_B": return{...s,body:s.body.filter(b=>b.id!==a.id)};
    case "GOALS": return{...s,goals:{...s.goals,...a.g}};
    case "UNITS": return{...s,units:a.units};
    case "PROFILE": return{...s,profile:{...s.profile,...a.p}};
    case "ONBOARD": return{...s,...a.data,onboarded:true};
    default: return s;
  }
}

// ─── MacroRing component ───
function MacroRing({value,goal,color,label}){
  const pct=goal>0?Math.min(1,value/goal):0;
  const r=22,circ=2*Math.PI*r;
  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
      <svg width={54} height={54} style={{transform:"rotate(-90deg)"}}>
        <circle cx={27} cy={27} r={r} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth={5}/>
        <circle cx={27} cy={27} r={r} fill="none" stroke={color} strokeWidth={5}
          strokeDasharray={circ} strokeDashoffset={circ*(1-pct)} strokeLinecap="round" style={{transition:"stroke-dashoffset .5s"}}/>
      </svg>
      <div style={{marginTop:-40,display:"flex",flexDirection:"column",alignItems:"center",height:40,justifyContent:"center"}}>
        <div style={{fontSize:11,fontWeight:800,color,fontFamily:V.mono}}>{value}</div>
        <div style={{fontSize:7,color:V.text3}}>/{goal}</div>
      </div>
      <div style={{fontSize:8,color:V.text3,fontWeight:600}}>{label}</div>
    </div>
  );
}

              const calOk=n&&s.goals?.cal?n.cal>=s.goals.cal*0.85:false;
              const protOk=n&&s.goals?.protein?n.protein>=s.goals.protein*0.9:false;
              const both=calOk&&protOk;const either=calOk||protOk;const isToday=day===today();
              return(
                <div key={i} style={{flex:1,display:"flex",flexDirection:"column",gap:2,alignItems:"center"}}>
                  <div style={{width:"100%",height:28,borderRadius:5,border:isToday?`1px solid ${V.accent}40`:"none",
                    background:both?"linear-gradient(180deg,#22c55e,#16a34a)":either?"linear-gradient(180deg,#f59e0b,#d97706)":n?"rgba(244,63,94,0.25)":"rgba(255,255,255,0.04)"}}/>
                  <div style={{fontSize:7,color:isToday?V.accent:V.text3,fontWeight:isToday?700:400}}>
                    {["Su","Mo","Tu","We","Th","Fr","Sa"][new Date(day+"T12:00:00").getDay()]}
                  </div>
                </div>
              );
            })}
          </div>
          <div style={{display:"flex",gap:10,marginTop:6}}>
            {[{c:"#22c55e",l:"Both"},{c:"#f59e0b",l:"Partial"},{c:"rgba(244,63,94,0.4)",l:"Missed"}].map(x=>(
              <div key={x.l} style={{display:"flex",alignItems:"center",gap:3}}>
                <div style={{width:8,height:8,borderRadius:2,background:x.c}}/><span style={{fontSize:7,color:V.text3}}>{x.l}</span>
              </div>
            ))}
          </div>
        </Card>
      )}

      {s.nutrition.length===0&&(
        <div style={{textAlign:"center",padding:"40px 20px",color:V.text3}}>
          <div style={{fontSize:48,marginBottom:12}}>🥗</div>
          <div style={{fontSize:16,fontWeight:600,color:V.text2,marginBottom:6}}>Nothing logged yet</div>
          <div style={{fontSize:13}}>Tap Log above to track your first meal</div>
        </div>
      )}
    </div>
  );
}

// ─── LOG TAB ───
function LogTab({s,d}){
  const emptyForm={date:today(),cal:"",protein:"",carbs:"",fat:"",fiber:"",water:"",sleep:"",

    const ex=s.nutrition.find(n=>n.date===td);

      fat:prev.fat.toString(),fiber:(prev.fiber||"").toString(),water:(prev.water||"").toString(),sleep:"",

  const rmFoodFromMeal=(mi,fi)=>setForm(f=>{const m=[...f.meals];m[mi]={...m[mi],items:m[mi].items.filter((_,i)=>i!==fi)};return{...f,meals:m};});

    let cal=0,protein=0,carbs=0,fat=0;
    form.meals.forEach(m=>(m.items||[]).forEach(i=>{cal+=i.cal||0;protein+=i.protein||0;carbs+=i.carbs||0;fat+=i.fat||0;}));

                <span style={{fontSize:18,fontWeight:700,color:V.warn,fontFamily:V.mono}}>{n.cal}<span style={{fontSize:10,color:V.text3}}> kcal</span></span>
                <span style={{fontSize:12,color:V.accent,fontFamily:V.mono}}>{n.protein}P</span>
                <span style={{fontSize:12,color:V.accent2,fontFamily:V.mono}}>{n.carbs}C</span>

              </div>
              <div style={{marginTop:6}}>
                <Progress val={n.cal} max={s.goals.cal} color={V.warn} h={3}/>
              </div>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── BODY TAB ───
function BodyTab({s,d}){
  const [show,setShow]=useState(false);
  const emptyForm={date:today(),weight:"",bf:"",waist:"",hips:"",chest:"",neck:"",arms:"",thighs:"",calves:""};
  const [form,setForm]=useState(emptyForm);
  const [showMeasurements,setShowMeasurements]=useState(false);
  const td=today();

  const save=()=>{
    const existing=s.body.find(e=>e.date===form.date);
    const b={id:existing?existing.id:uid(),date:form.date,weight:parseFloat(form.weight)||0,bf:parseFloat(form.bf)||0,
      waist:parseFloat(form.waist)||0,hips:parseFloat(form.hips)||0,chest:parseFloat(form.chest)||0,
      neck:parseFloat(form.neck)||0,arms:parseFloat(form.arms)||0,thighs:parseFloat(form.thighs)||0,calves:parseFloat(form.calves)||0};
    d({type:existing?"EDIT_B":"ADD_B",b});Haptic.success();Toast.show("Body log saved",V.accent);setShow(false);
  };

  const latest=s.body[0],prev=s.body[1];
  const wc=latest&&prev?(parseFloat(latest.weight)||0)-(parseFloat(prev.weight)||0):0;

  const trend=useMemo(()=>s.body.filter(m=>m.date>=ago(60)).sort((a,b)=>a.date.localeCompare(b.date)).map(m=>({date:fmtShort(m.date),wt:+(parseFloat(m.weight)||0).toFixed(1),bf:+((parseFloat(m.bf)||0).toFixed(1))})),[s.body]);

  const ffmiCard=(()=>{
    const hM=parseHeightToM(s.profile?.height);
    const wKg=latest?.weight?parseFloat(latest.weight)/(s.units==="kg"?1:2.205):0;
    const bf=latest?.bf?parseFloat(latest.bf):0;
    if(!hM||!wKg||!bf)return null;
    const leanMassKg=wKg*(1-bf/100);
    const ffmi=leanMassKg/(hM*hM);
    const bmi=wKg/(hM*hM);
    const ffmiRating=ffmi<18?"Below avg":ffmi<20?"Average":ffmi<22?"Fit":ffmi<24?"Athletic":ffmi<26?"Advanced":"Elite";
    const bmiCat=bmi<18.5?"Underweight":bmi<25?"Normal":bmi<30?"Overweight":"Obese";
    return{ffmi:ffmi.toFixed(1),ffmiRating,bmi:bmi.toFixed(1),bmiCat,leanMass:leanMassKg.toFixed(1)};
  })();

  return(
    <div className="fade-up" style={{display:"flex",flexDirection:"column",gap:12}}>
      <div style={{display:"flex",gap:8}}>
        <Btn full onClick={()=>{setForm({...emptyForm,date:td});setShowMeasurements(false);setShow(true);}}>
          {I.plus({s:16,c:"#060a0e"})} Log Today
        </Btn>
        {s.body.find(b=>b.date===ago(1))&&(
          <Btn v="secondary" onClick={()=>{const yd=s.body.find(b=>b.date===ago(1));if(yd){setForm({date:td,weight:yd.weight?.toString()||"",bf:yd.bf?.toString()||"",waist:yd.waist?.toString()||"",hips:yd.hips?.toString()||"",chest:yd.chest?.toString()||"",neck:yd.neck?.toString()||"",arms:yd.arms?.toString()||"",thighs:yd.thighs?.toString()||"",calves:yd.calves?.toString()||""});setShow(true);}}} s={{flexShrink:0,fontSize:11}}>
            {I.copy({s:14,c:V.text2})} Yesterday
          </Btn>
        )}
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <div style={{gridColumn:"1/-1"}}>
          <Stat icon={I.scale} label="Weight" value={latest?.weight?parseFloat(latest.weight).toFixed(1):"—"} unit={wUnit(s.units)} color={V.purple}
            sub={wc!==0?`${wc>0?"↗ +":"↘ "}${wc.toFixed(1)} ${wUnit(s.units)}`:latest?"→ stable":undefined}/>
          {s.goals?.goalWeight&&latest?.weight&&(()=>{
            const cur=parseFloat(latest.weight)||0,goal=parseFloat(s.goals.goalWeight)||0;
            const start=s.body.slice(-1)[0]?.weight?parseFloat(s.body.slice(-1)[0].weight)||cur:cur;
            if(!goal)return null;
            const losing=goal<start,total=Math.abs(start-goal),done=Math.abs(cur-start);
            const pct=total>0?Math.min(100,Math.round(done/total*100)):0;
            const remaining=Math.abs(goal-cur).toFixed(1);
            return(
              <div style={{marginTop:6,padding:"8px 10px",borderRadius:8,background:"rgba(255,255,255,0.02)"}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                  <span style={{fontSize:9,color:V.text3}}>Goal: {goal}{wUnit(s.units)}</span>
                  <span style={{fontSize:9,fontWeight:700,color:V.accent}}>{pct}% there · {remaining}{wUnit(s.units)} to go</span>
                </div>
                <div style={{height:5,borderRadius:3,background:"rgba(255,255,255,0.06)"}}>
                  <div style={{height:5,borderRadius:3,width:`${pct}%`,background:losing?"linear-gradient(90deg,#f43f5e,#f97316)":"linear-gradient(90deg,#22c55e,#86efac)",transition:"width .5s"}}/>
                </div>
              </div>
            );
          })()}
        </div>
        <Stat icon={I.target} label="Body Fat" value={latest?.bf?parseFloat(latest.bf).toFixed(1):"—"} unit="%" color={V.danger}/>
        <Stat icon={I.flame} label="Lean Mass" value={latest?.bf&&latest?.weight?(parseFloat(latest.weight)*(1-(parseFloat(latest.bf)||0)/100)).toFixed(1):"—"} unit={wUnit(s.units)} color={V.accent}/>
      </div>

      {/* FFMI/BMI card */}
      {ffmiCard&&(
        <Card style={{padding:14}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
            {[{l:"FFMI",v:ffmiCard.ffmi,sub:ffmiCard.ffmiRating,c:V.accent},{l:"BMI",v:ffmiCard.bmi,sub:ffmiCard.bmiCat,c:V.accent2},{l:"Lean Mass",v:`${ffmiCard.leanMass}kg`,c:V.purple}].map(m=>(
              <div key={m.l} style={{textAlign:"center",padding:"10px 0",borderRadius:8,background:"rgba(255,255,255,0.02)"}}>
                <div style={{fontSize:10,color:V.text3,fontWeight:600,marginBottom:2}}>{m.l}</div>
                <div style={{fontSize:18,fontWeight:800,color:m.c,fontFamily:V.mono}}>{m.v}</div>
                {m.sub&&<div style={{fontSize:9,color:V.text3,marginTop:2}}>{m.sub}</div>}
              </div>
            ))}
          </div>
        </Card>
      )}

      {/* 7-day avg weight */}
      {s.body.length>=3&&(()=>{
        const last7=s.body.filter(b=>b.date>=ago(7)&&parseFloat(b.weight)>0);
        const last14=s.body.filter(b=>b.date>=ago(14)&&b.date<ago(7)&&parseFloat(b.weight)>0);
        const avg7=last7.length?last7.reduce((a,b)=>a+parseFloat(b.weight),0)/last7.length:0;
        const avg14=last14.length?last14.reduce((a,b)=>a+parseFloat(b.weight),0)/last14.length:0;
        const diff=avg7&&avg14?avg7-avg14:0;
        if(!avg7)return null;
        return(
          <Card style={{padding:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontSize:10,fontWeight:700,color:V.text3}}>7-DAY AVERAGE</div>
                <div style={{fontSize:20,fontWeight:800,color:V.purple,fontFamily:V.mono}}>{avg7.toFixed(1)} <span style={{fontSize:10,color:V.text3}}>{wUnit(s.units)}</span></div>
              </div>
              {diff!==0&&<div style={{textAlign:"right"}}>
                <div style={{fontSize:9,color:V.text3}}>vs prior week</div>
                <div style={{fontSize:14,fontWeight:700,color:diff>0?V.warn:V.accent,fontFamily:V.mono}}>{diff>0?"+":""}{diff.toFixed(1)}</div>
              </div>}
            </div>
          </Card>
        );
      })()}

      {/* Weight trend chart */}
      {trend.length>=2&&(
        <Card>
          <div style={{fontSize:10,fontWeight:700,color:V.text3,marginBottom:10,textTransform:"uppercase",letterSpacing:".06em"}}>60-Day Trend</div>
          <ResponsiveContainer width="100%" height={130}>
            <LineChart data={trend}>
              <CartesianGrid {...chartCfg.grid} vertical={false}/>
              <XAxis dataKey="date" {...chartCfg.axis} interval="preserveStartEnd"/>
              <YAxis {...chartCfg.axis} width={32} domain={["auto","auto"]}/>
              <Tooltip {...chartCfg.tip}/>
              <Line type="monotone" dataKey="wt" stroke={V.purple} strokeWidth={2} dot={false} name="Weight"/>
            </LineChart>
          </ResponsiveContainer>
        </Card>
      )}

      {/* Body log sheet */}
      {show&&(
        <Sheet title="Log Body Metrics" onClose={()=>setShow(false)}
          footer={<Btn full onClick={save}>{I.check({s:16,c:"#060a0e"})} Save Log</Btn>}>
          <Field label="Date" type="date" value={form.date} onChange={v=>setForm(f=>({...f,date:v}))}/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <Field label={`Weight (${wUnit(s.units)})`} type="number" value={form.weight} onChange={v=>setForm(f=>({...f,weight:v}))} step="0.1"/>
            <Field label="Body Fat %" type="number" value={form.bf} onChange={v=>setForm(f=>({...f,bf:v}))} unit="%" step="0.1"/>
          </div>
          <button onClick={()=>setShowMeasurements(m=>!m)} style={{width:"100%",padding:"10px",borderRadius:10,background:"rgba(255,255,255,0.02)",border:`1px dashed ${V.cardBorder}`,cursor:"pointer",fontSize:12,color:V.text3,fontFamily:V.font,marginBottom:12}}>
            {showMeasurements?"Hide":"+ Add"} Measurements (optional)
          </button>
          {showMeasurements&&(
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              {[{k:"waist",l:"Waist"},{k:"hips",l:"Hips"},{k:"chest",l:"Chest"},{k:"neck",l:"Neck"},{k:"arms",l:"Arms"},{k:"thighs",l:"Thighs"},{k:"calves",l:"Calves"}].map(f=>(
                <Field key={f.k} label={`${f.l} (in)`} type="number" value={form[f.k]} onChange={v=>setForm(p=>({...p,[f.k]:v}))} step="0.25"/>
              ))}
            </div>
          )}
        </Sheet>
      )}

      {/* History */}
      {s.body.slice(0,10).map(m=>(
        <Card key={m.id} style={{padding:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:12,color:V.text2}}>{fmtFull(m.date)}</span>
            <button aria-label={`Delete body log for ${fmtFull(m.date)}`} onClick={()=>ConfirmCtrl.show("Delete body log?",fmtFull(m.date),()=>{const deleted=m;d({type:"DEL_B",id:m.id});UndoMgr.show("Body log deleted",()=>d({type:"ADD_B",b:deleted}),V.danger);})} style={{background:"none",border:"none",padding:4,cursor:"pointer"}}>{I.trash({s:13,c:V.text3})}</button>
          </div>
          <div style={{display:"flex",gap:16,marginTop:6}}>
            <span style={{fontSize:16,fontWeight:700,color:V.purple,fontFamily:V.mono}}>{(parseFloat(m.weight)||0).toFixed(1)}<span style={{fontSize:10,color:V.text3}}>{wUnit(s.units)}</span></span>
            {m.bf>0&&<span style={{fontSize:14,color:V.danger,fontFamily:V.mono}}>{(parseFloat(m.bf)||0).toFixed(1)}<span style={{fontSize:10,color:V.text3}}>%bf</span></span>}
          </div>
          {(m.waist>0||m.chest>0||m.arms>0)&&(
            <div style={{display:"flex",gap:10,marginTop:4,fontSize:10,color:V.text3,fontFamily:V.mono}}>
              {m.waist>0&&<span>W:{m.waist}"</span>}
              {m.chest>0&&<span>Ch:{m.chest}"</span>}
              {m.arms>0&&<span>Ar:{m.arms}"</span>}
            </div>
          )}
        </Card>
      ))}
    </div>
  );
}

// ─── TRENDS TAB ───
function TrendsTab({s}){
  const [range,setRange]=useState(30);
  const macroChart=useMemo(()=>s.nutrition.filter(n=>n.date>=ago(range)).sort((a,b)=>a.date.localeCompare(b.date)).map(n=>({date:fmtShort(n.date),P:n.protein,C:n.carbs,F:n.fat})),[s.nutrition,range]);
  const calChart=useMemo(()=>s.nutrition.filter(n=>n.date>=ago(range)).sort((a,b)=>a.date.localeCompare(b.date)).map(n=>({date:fmtShort(n.date),cal:n.cal})),[s.nutrition,range]);
  const week=s.nutrition.filter(n=>n.date>=ago(7));
  const avgCal=week.length?Math.round(week.reduce((s,n)=>s+n.cal,0)/week.length):0;
  const avgProt=week.length?Math.round(week.reduce((s,n)=>s+n.protein,0)/week.length):0;
  const protGoal=s.goals?.protein||180;
  const protHitDays=week.filter(n=>n.protein>=protGoal*0.9).length;
  const protHitRate=week.length?Math.round(protHitDays/week.length*100):0;

  // DOW protein analysis
  const dowData=useMemo(()=>{
    const dayNames=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    return Array.from({length:7},(_,dow)=>{
      const entries=s.nutrition.filter(n=>{const d=new Date(n.date+"T12:00:00");return d.getDay()===dow&&n.date>=ago(27);});
      return{dow,name:dayNames[dow],count:entries.length,protHit:entries.filter(n=>n.protein>=protGoal*0.9).length,avgProt:entries.length?Math.round(entries.reduce((a,n)=>a+(n.protein||0),0)/entries.length):0};
    });
  },[s.nutrition,protGoal]);

  const insights=useMemo(()=>{
    const calGoal=s.goals?.cal||2200;
    const ins=[];
    const weakDays=dowData.filter(d=>d.count>=2&&d.protHit/d.count<0.5).map(d=>d.name);
    const strongDays=dowData.filter(d=>d.count>=2&&d.protHit/d.count>=0.85).map(d=>d.name);
    const thisW=s.nutrition.filter(n=>n.date>=ago(6)).length;
    const lastW=s.nutrition.filter(n=>n.date>=ago(13)&&n.date<ago(6)).length;
    const under=s.nutrition.filter(n=>n.date>=ago(13)&&n.cal>0&&n.cal<calGoal*0.75).length;
    if(weakDays.length>0)ins.push({icon:"⚠️",color:V.warn,text:`Protein gap on ${weakDays.slice(0,2).join(" & ")} — plan ahead`});
    if(strongDays.length>0)ins.push({icon:"💪",color:V.accent,text:`Nailing protein on ${strongDays.slice(0,2).join(" & ")} — keep it up`});
    if(thisW>lastW)ins.push({icon:"📈",color:V.accent,text:`${thisW} days logged this week vs ${lastW} last — consistency building`});
    else if(thisW<lastW&&lastW>=4)ins.push({icon:"📉",color:V.warn,text:`${lastW-thisW} fewer logs than last week`});
    if(under>=4)ins.push({icon:"🔋",color:V.danger,text:`Under-fuelling ${under} days lately — calories too low`});
    return ins;
  },[s.nutrition,dowData,s.goals]);

  if(s.nutrition.length<3)return(
    <div className="fade-up" style={{textAlign:"center",padding:"60px 20px",color:V.text3}}>
      <div style={{fontSize:48,marginBottom:12}}>📊</div>
      <div style={{fontSize:16,fontWeight:600,color:V.text2,marginBottom:6}}>Not enough data yet</div>
      <div style={{fontSize:13}}>Log at least 3 days to see trends</div>
    </div>
  );

  return(
    <div className="fade-up" style={{display:"flex",flexDirection:"column",gap:12}}>
      <div style={{display:"flex",gap:6}}>
        {[7,14,30,60].map(r=><Chip key={r} label={`${r}d`} active={range===r} onClick={()=>setRange(r)}/>)}
      </div>

      {/* Quick stats */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <Stat icon={I.flame} label="Avg Calories (7d)" value={avgCal} unit="kcal" color={V.warn}/>
        <Stat icon={I.target} label="Avg Protein (7d)" value={avgProt} unit="g" color={V.accent} sub={week.length?`${protHitDays}/${week.length}d hit goal`:undefined}/>
      </div>

      {/* Protein hit rate bar */}
      <Card style={{padding:12}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
          <span style={{fontSize:10,color:V.text3,fontWeight:700,textTransform:"uppercase",letterSpacing:".06em"}}>Protein Goal Rate (7d)</span>
          <span style={{fontSize:12,fontWeight:800,color:protHitRate>=80?"#22c55e":protHitRate>=50?V.warn:"#f43f5e",fontFamily:V.mono}}>{protHitRate}%</span>
        </div>
        <div style={{height:8,borderRadius:4,background:"rgba(255,255,255,0.06)"}}>
          <div style={{height:"100%",borderRadius:4,transition:"width .5s",width:`${protHitRate}%`,background:protHitRate>=80?"linear-gradient(90deg,#22c55e,#86efac)":protHitRate>=50?"linear-gradient(90deg,#f59e0b,#fcd34d)":"linear-gradient(90deg,#f43f5e,#fb7185)"}}/>
        </div>
      </Card>

      {/* DOW Heatmap */}
      {s.nutrition.length>=7&&(
        <Card style={{padding:12}}>
          <div style={{fontSize:10,fontWeight:700,color:V.text3,textTransform:"uppercase",letterSpacing:".06em",marginBottom:10}}>Day-of-Week Protein Pattern (28d)</div>
          <div style={{display:"flex",gap:4}}>
            {dowData.map(d=>{
              const rate=d.count>0?d.protHit/d.count:null;
              const bg=rate===null?"rgba(255,255,255,0.04)":rate>=0.85?"rgba(74,222,128,0.35)":rate>=0.5?"rgba(251,146,60,0.35)":"rgba(244,63,94,0.25)";
              return(
                <div key={d.dow} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
                  <div style={{width:"100%",height:24,borderRadius:4,background:bg,display:"flex",alignItems:"center",justifyContent:"center"}}>
                    {d.count>0&&<span style={{fontSize:7,fontWeight:700,color:"rgba(255,255,255,0.5)"}}>{d.avgProt}g</span>}
                  </div>
                  <span style={{fontSize:7,color:V.text3}}>{d.name.slice(0,2)}</span>
                </div>
              );
            })}
          </div>
        </Card>
      )}

      {/* Insights */}
      {insights.length>0&&(
        <Card style={{padding:14}}>
          <div style={{fontSize:10,fontWeight:700,color:V.text3,textTransform:"uppercase",letterSpacing:".06em",marginBottom:10}}>📊 Patterns</div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {insights.map((ins,i)=>(
              <div key={i} style={{display:"flex",alignItems:"flex-start",gap:8,padding:"8px 10px",borderRadius:8,background:"rgba(255,255,255,0.02)"}}>
                <span style={{fontSize:14,flexShrink:0}}>{ins.icon}</span>
                <span style={{fontSize:12,color:V.text2,lineHeight:1.5}}>{ins.text}</span>
              </div>
            ))}
          </div>
        </Card>
      )}

      {/* Macro stacked bar */}
      {macroChart.length>1&&(
        <Card>
          <div style={{fontSize:10,fontWeight:700,color:V.text3,marginBottom:10,textTransform:"uppercase",letterSpacing:".06em"}}>Macro Breakdown ({range}d)</div>
          <ResponsiveContainer width="100%" height={150}>
            <BarChart data={macroChart} barSize={8}>
              <CartesianGrid {...chartCfg.grid} vertical={false}/>
              <XAxis dataKey="date" {...chartCfg.axis} interval="preserveStartEnd"/>
              <YAxis {...chartCfg.axis} width={28}/>
              <Tooltip {...chartCfg.tip}/>
              <Bar dataKey="P" stackId="a" fill={V.accent} name="Protein"/>
              <Bar dataKey="C" stackId="a" fill={V.accent2} name="Carbs"/>
              <Bar dataKey="F" stackId="a" fill={V.warn} radius={[3,3,0,0]} name="Fat"/>
            </BarChart>
          </ResponsiveContainer>
        </Card>
      )}

      {/* Calorie line chart */}
      {calChart.length>1&&(
        <Card>
          <div style={{fontSize:10,fontWeight:700,color:V.text3,marginBottom:10,textTransform:"uppercase",letterSpacing:".06em"}}>Calorie Trend ({range}d)</div>
          <ResponsiveContainer width="100%" height={130}>
            <LineChart data={calChart}>
              <CartesianGrid {...chartCfg.grid} vertical={false}/>
              <XAxis dataKey="date" {...chartCfg.axis} interval="preserveStartEnd"/>
              <YAxis {...chartCfg.axis} width={36} domain={[0,"auto"]}/>
              <Tooltip {...chartCfg.tip}/>
              <ReferenceLine y={s.goals?.cal||2200} stroke={V.accent} strokeDasharray="4 4" strokeWidth={1}/>
              <Line type="monotone" dataKey="cal" stroke={V.warn} strokeWidth={2} dot={false} name="Calories"/>
            </LineChart>
          </ResponsiveContainer>
        </Card>
      )}
    </div>
  );
}

// ─── SETTINGS TAB ───
function SettingsTab({s,d,installPrompt,onInstalled}){
  const [goals,setGoals]=useState(s.goals);
  const [profile,setProfile]=useState(s.profile);
  const [open,setOpen]=useState(null);
  const [saved,setSaved]=useState(false);
  const toggle=(id)=>setOpen(o=>o===id?null:id);
  useEffect(()=>setGoals(s.goals),[s.goals]);
  useEffect(()=>setProfile(s.profile),[s.profile]);

  const saveGoals=()=>{
    d({type:"GOALS",g:{cal:parseInt(goals.cal)||2200,protein:parseInt(goals.protein)||180,carbs:parseInt(goals.carbs)||220,fat:parseInt(goals.fat)||65,goalWeight:parseFloat(goals.goalWeight)||0,tdee:parseInt(goals.tdee)||0,fiber:parseInt(goals.fiber)||25}});
    setSaved(true);setTimeout(()=>setSaved(false),2000);Toast.show("Goals saved",V.accent);
  };

  const saveProfile=()=>{
    d({type:"PROFILE",p:profile});Toast.show("Profile saved",V.accent);
  };

  const applyPreset=(key)=>{
    const p=MACRO_PRESETS[key];
    setGoals(g=>({...g,cal:p.cal,protein:p.protein,carbs:p.carbs,fat:p.fat}));
    Toast.show(`${p.icon} ${key} preset applied`,V.accent);
  };

  const logout=async()=>{
    await SessionManager.revoke();
    LS.set("ft-onb",false);LS.set("nl-onb",false);
    window.location.reload();
  };

  const Row=({id,icon,label,desc,children})=>(
    <div style={{background:V.card,border:`1px solid ${V.cardBorder}`,borderRadius:14,overflow:"hidden",marginBottom:8}}>
      <button onClick={()=>toggle(id)} style={{display:"flex",alignItems:"center",gap:12,padding:"14px 16px",width:"100%",background:"none",border:"none",cursor:"pointer",textAlign:"left",WebkitTapHighlightColor:"transparent"}}>
        <div style={{width:28,height:28,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{icon}</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:14,fontWeight:600,color:V.text}}>{label}</div>
          {desc&&<div style={{fontSize:11,color:V.text3,marginTop:1}}>{desc}</div>}
        </div>
        <div style={{transition:"transform .2s",transform:open===id?"rotate(90deg)":"none"}}>{I.chevRight({s:16,c:V.text3})}</div>
      </button>
      {open===id&&(
        <div style={{padding:"0 16px 16px",borderTop:`1px solid ${V.cardBorder}`}}>
          <div style={{paddingTop:12}}>{children}</div>
        </div>
      )}
    </div>
  );

  return(
    <div className="fade-up" style={{display:"flex",flexDirection:"column",gap:0}}>
      {/* Macro presets */}
      <div style={{marginBottom:14}}>
        <div style={{fontSize:10,fontWeight:700,color:V.text3,marginBottom:8,letterSpacing:".06em"}}>MACRO PRESETS</div>
        <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:4,WebkitOverflowScrolling:"touch"}}>
          {Object.entries(MACRO_PRESETS).map(([key,p])=>(
            <button key={key} onClick={()=>applyPreset(key)} style={{padding:"8px 12px",borderRadius:10,background:`${V.accent}08`,border:`1px solid ${V.accent}20`,cursor:"pointer",whiteSpace:"nowrap",flexShrink:0,WebkitTapHighlightColor:"transparent"}}>
              <div style={{fontSize:14}}>{p.icon}</div>
              <div style={{fontSize:10,fontWeight:700,color:V.text,marginTop:2}}>{key}</div>
              <div style={{fontSize:8,color:V.text3}}>{p.desc}</div>
            </button>
          ))}
        </div>
      </div>

      <Row id="goals" icon="🎯" label="Nutrition Goals" desc={`${s.goals.cal} cal · ${s.goals.protein}P`}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Field label="Calories" type="number" value={goals.cal?.toString()||""} onChange={v=>setGoals(g=>({...g,cal:v}))} unit="kcal"/>
          <Field label="Protein" type="number" value={goals.protein?.toString()||""} onChange={v=>setGoals(g=>({...g,protein:v}))} unit="g"/>
          <Field label="Carbs" type="number" value={goals.carbs?.toString()||""} onChange={v=>setGoals(g=>({...g,carbs:v}))} unit="g"/>
          <Field label="Fat" type="number" value={goals.fat?.toString()||""} onChange={v=>setGoals(g=>({...g,fat:v}))} unit="g"/>
          <Field label="Fiber" type="number" value={goals.fiber?.toString()||""} onChange={v=>setGoals(g=>({...g,fiber:v}))} unit="g"/>
          <Field label="Goal Weight" type="number" value={goals.goalWeight?.toString()||""} onChange={v=>setGoals(g=>({...g,goalWeight:v}))} unit={wUnit(s.units)}/>
        </div>
        <Field label="TDEE (for surplus/deficit calc)" type="number" value={goals.tdee?.toString()||""} onChange={v=>setGoals(g=>({...g,tdee:v}))} unit="kcal" placeholder="Optional"/>

          <span style={{fontSize:24}}>📲</span>

  );

  return(

// ─── Debounced cloud sync (canonical) ───
const debouncedSync=(s)=>CloudSync.debouncedPush(s);

// ─── Error Boundary ───
class ErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={hasError:false,error:null};}
  static getDerivedStateFromError(error){return{hasError:true,error};}
  render(){
    if(this.state.hasError){
      return React.createElement("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",padding:24,textAlign:"center",background:"#060a0e"}},
        React.createElement("div",{style:{fontSize:48,marginBottom:12}},"⚠️"),
        React.createElement("div",{style:{fontSize:18,fontWeight:700,color:"#e2e8f0",marginBottom:8}},"Something went wrong"),
        React.createElement("div",{style:{fontSize:13,color:"#94a3b8",marginBottom:20,maxWidth:300}},this.state.error?.message||"An unexpected error occurred"),
        React.createElement("button",{onClick:()=>window.location.reload(),style:{padding:"12px 24px",borderRadius:12,border:"none",background:"#4ade80",color:"#060a0e",fontSize:14,fontWeight:600,cursor:"pointer"}},"Reload App")
      );
    }
    return this.props.children;
  }
}

// ─── APP ───
function App(){
  const [s,d]=useReducer(reducer,init);

  const score=useMemo(()=>calcScore(s),[s.nutrition,s.body,s.goals]);
  const missions=useMemo(()=>getDailyMissions(s),[s.nutrition,s.body,s.goals]);
  const {celebrating,celebRank,dismiss:dismissLevel}=useLevelUp(score,"nl-last-level");
  const [online,setOnline]=useState(navigator.onLine);
  const [installPrompt,setInstallPrompt]=useState(null);
  useEffect(()=>{
    const on=()=>setOnline(true);const off=()=>setOnline(false);
    window.addEventListener("online",on);window.addEventListener("offline",off);
    const bip=(e)=>{e.preventDefault();setInstallPrompt(e);};
    window.addEventListener("beforeinstallprompt",bip);
    return()=>{window.removeEventListener("online",on);window.removeEventListener("offline",off);window.removeEventListener("beforeinstallprompt",bip);};
  },[]);

  // Handle URL tab param for manifest shortcuts
  useEffect(()=>{
    const params=new URLSearchParams(window.location.search);
    const tab=params.get("tab");
    if(tab&&["home","log","body","trends","settings"].includes(tab)){d({type:"TAB",tab});}
  },[]);

  // Load data on boot
  useEffect(()=>{
    (async()=>{
      try{
        const nutrition=LS.get("ft-n")||[];
        const body=LS.get("ft-b")||[];
        const goals=LS.get("ft-g")||init.goals;
        const units=LS.get("ft-units")||"lbs";
        const profile=LS.get("ft-profile")||init.profile;
        const localOnboarded=LS.get("ft-onb")||LS.get("nl-onb")||false;

        // SSO: not onboarded locally but ironlog cookie exists
        if(!localOnboarded){
          const ssoToken=Cookie.get("ironlog_session");
          if(ssoToken){
            try{
              const vRes=await fetch(`${SYNC_URL}/api/auth/session`,{method:"POST",headers:{"Content-Type":"application/json","X-Session-Token":ssoToken},body:JSON.stringify({action:"validate"})});
              const vJson=await vRes.json();
              if(vJson.valid&&vJson.email){
                const deviceId=LS.get("ft-device-id")||uid();LS.set("ft-device-id",deviceId);
                LS.set("ft-session-token",ssoToken);LS.set("ft-session-email",vJson.email);
                const pull=await CloudSync.pull(vJson.email,deviceId,null);
                if(pull?.success&&pull?.data){
                  const data=pull.data;
                  LS.set("ft-onb",true);LS.set("nl-onb",true);
                  d({type:"INIT",p:{nutrition:data.nutrition||[],body:data.body||[],goals:data.goals||init.goals,units:data.units||"lbs",profile:data.profile||init.profile,onboarded:true}});
                  return;
                }
              }
            }catch(e){/* SSO failed silently */}
          }
        }

        d({type:"INIT",p:{nutrition,body,goals,units,profile,onboarded:localOnboarded}});
      }catch(e){d({type:"INIT",p:{...init,onboarded:false}});}
    })();
  },[]);

  // Persist to LS on state change
  useEffect(()=>{
    if(!s.loaded)return;
    LS.set("ft-n",s.nutrition);
    LS.set("ft-b",s.body);
    LS.set("ft-g",s.goals);
    LS.set("ft-units",s.units);
    LS.set("ft-profile",s.profile);
    LS.set("ft-onb",s.onboarded);
    LS.set("nl-onb",s.onboarded);
    // Auto-sync to cloud (debounced)
    if(s.onboarded&&s.profile?.email){
      debouncedSync(s);
    }
  },[s.nutrition,s.body,s.goals,s.units,s.profile,s.onboarded]);

  if(!s.loaded)return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",flexDirection:"column",gap:16,background:V.bg}}>
      <div style={{fontSize:40}}>🥗</div>
      <div style={{fontSize:13,color:V.text3,fontFamily:V.mono,animation:"pulse 1.5s infinite"}}>Loading your data...</div>
      <div style={{width:180,height:4,borderRadius:2,background:"rgba(255,255,255,0.05)",overflow:"hidden"}}>
        <div style={{width:"40%",height:"100%",borderRadius:2,background:`linear-gradient(90deg,transparent,${V.accent}40,transparent)`,animation:"shimmer 1.5s infinite"}}/>
      </div>
    </div>
  );

  if(!s.onboarded)return <Onboarding d={d}/>;

  const tabs=[
    {id:"home",label:"Home",icon:I.home},
    {id:"log",label:"Log",icon:I.log},
    {id:"body",label:"Body",icon:I.body},
    {id:"trends",label:"Trends",icon:I.chart},
    {id:"settings",label:"Settings",icon:I.settings},
  ];

  return(
    <div style={{height:"100%",display:"flex",flexDirection:"column",background:V.bg}}>
      {/* Header */}
      <header style={{paddingTop:`max(16px,env(safe-area-inset-top,0px))`,paddingLeft:16,paddingRight:16,paddingBottom:10,background:V.navBg,borderBottom:`1px solid ${V.cardBorder}`,flexShrink:0,backdropFilter:"blur(12px)",WebkitBackdropFilter:"blur(12px)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:22}}>🥗</span>
            <div>
              <div style={{fontSize:16,fontWeight:800,color:V.text,lineHeight:1}}>NutritionLog</div>
              <div style={{fontSize:9,color:V.text3,fontWeight:600,letterSpacing:".1em"}}>by IRONLOG</div>
            </div>
          </div>
          {(()=>{
            const todayN=s.nutrition.find(n=>n.date===today());
            const tCal=todayN?.cal||0,calGoal=s.goals?.cal||2200;
            const remaining=calGoal-tCal;
            if(!tCal)return null;
            return(
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:11,fontWeight:800,color:remaining>=0?V.accent:V.danger,fontFamily:V.mono}}>
                  {Math.abs(remaining)} cal {remaining>=0?"left":"over"}
                </div>
                <div style={{fontSize:9,color:V.text3}}>{todayN?.protein||0}g protein today</div>
              </div>
            );
          })()}
        </div>
      </header>

      {/* Offline indicator */}
      {!online&&(
        <div style={{background:"rgba(251,146,60,0.15)",borderBottom:`1px solid rgba(251,146,60,0.25)`,padding:"6px 16px",textAlign:"center",fontSize:11,fontWeight:600,color:V.warn,flexShrink:0}}>
          You're offline — changes will sync when reconnected
        </div>
      )}

      {/* Content */}
      <main style={{flex:1,overflowY:"auto",WebkitOverflowScrolling:"touch",overscrollBehavior:"contain"}} role="main">
        <div className="main-scroll" style={{paddingTop:16}}>
          {s.tab==="home"&&<HomeTab s={s} d={d} score={score} missions={missions}/>}
          {s.tab==="log"&&<LogTab s={s} d={d}/>}
          {s.tab==="body"&&<BodyTab s={s} d={d}/>}
          {s.tab==="trends"&&<TrendsTab s={s}/>}
          {s.tab==="settings"&&<SettingsTab s={s} d={d} installPrompt={installPrompt} onInstalled={()=>setInstallPrompt(null)}/>}
        </div>
      </main>

      {/* Bottom Nav */}
      <nav className="tab-bar" role="tablist" aria-label="Main navigation" style={{background:V.navBg,borderTop:`1px solid ${V.cardBorder}`,display:"flex",backdropFilter:"blur(12px)",WebkitBackdropFilter:"blur(12px)",flexShrink:0,paddingTop:8}}>
        {tabs.map(tab=>{
          const active=s.tab===tab.id;
          return(
            <button key={tab.id} onClick={()=>{Haptic.light();d({type:"TAB",tab:tab.id});}} aria-label={tab.label} aria-current={active?"page":undefined} role="tab" style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3,background:"none",border:"none",cursor:"pointer",padding:"4px 0",WebkitTapHighlightColor:"transparent",transition:"all .15s"}}>
              {tab.icon({s:21,c:active?V.accent:V.text3})}
              <span style={{fontSize:9,fontWeight:active?700:500,color:active?V.accent:V.text3,transition:"color .15s"}}>{tab.label}</span>
              {active&&<div style={{width:4,height:4,borderRadius:2,background:V.accent,marginTop:-2}}/>}
            </button>
          );
        })}
      </nav>

      <ToastDisplay/>
      <GlobalConfirm/>
      <UndoToastBar/>
      {celebrating&&celebRank&&<LevelUpCelebration rank={celebRank} onDismiss={dismissLevel}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
